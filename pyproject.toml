[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opengeo"
version = "0.1.0"
description = "Deterministic geospatial services, contracts and tooling for OpenGeo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "shapely>=2.0",
    "ruff>=0.6",
    "mcp>=2.0",
]
mcp = ["mcp>=2.0"]

[project.scripts]
opengeo-api = "opengeo.api.__main__:main"
opengeo-mcp = "opengeo.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
