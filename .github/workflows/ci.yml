name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest
      - name: Ingestion gate runs on the shipped fixture
        run: opengeo-ingest --source data/fixtures/pune_places.geojson
      - name: OpenAPI document builds
        run: python -c "from opengeo.api.app import app; assert app.openapi()['paths']"

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: opengeo
          POSTGRES_USER: opengeo
          POSTGRES_PASSWORD: opengeo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opengeo -d opengeo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migration applies on a fresh database
        run: python - <<'PY'
import pathlib, psycopg
sql = pathlib.Path("infrastructure/db/migrations/0001_init.sql").read_text()
with psycopg.connect("postgresql://opengeo:opengeo@localhost:5432/opengeo") as conn:
    with conn.cursor() as cur:
        cur.execute(sql)
        conn.commit()
        cur.execute("SELECT postgis_version()")
        assert cur.fetchone()[0].startswith("3.4")
PY
      - name: Publication invariant smoke test
        env:
          OPENGEO_DATABASE_URL: postgresql://opengeo:opengeo@localhost:5432/opengeo
        run: pytest tests/test_publication_smoke.py -q

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/geo_types
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
