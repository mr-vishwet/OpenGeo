name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest
      - name: Ingestion gate runs on the shipped fixture
        run: opengeo-ingest --source data/fixtures/pune_places.geojson
      - name: OpenAPI document builds
        run: python -c "from opengeo.api.app import app; assert app.openapi()['paths']"

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/geo_types
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
